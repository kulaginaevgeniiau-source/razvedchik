name: Сводка в Telegram
# Отправляет data/telegram.txt, как только облачный Разведчик его обновил
on:
  push:
    branches: [main]
    paths: [data/telegram.txt]
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/send_telegram.py data/telegram.txt
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
